<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="Play editor desktop wireframe">
  <style>
    .bg { fill: #f4f4f5; }
    .panel { fill: #fff; stroke: #d4d4d8; stroke-width: 0.5; }
    .surface-2 { fill: #f4f4f5; }
    .surface-3 { fill: #fafafa; }
    .surface-info { fill: #eff6ff; }
    .divider { stroke: #e4e4e7; stroke-width: 0.5; }
    .label { font-size: 10px; fill: #71717a; text-transform: uppercase; letter-spacing: 0.05em; }
    .body { font-size: 12px; fill: #18181b; }
    .body-2 { font-size: 12px; fill: #52525b; }
    .body-3 { font-size: 11px; fill: #71717a; }
    .hint { font-size: 11px; fill: #a1a1aa; }
    .pill-neutral { fill: #f4f4f5; }
    .pill-neutral-text { font-size: 11px; fill: #52525b; }
    .pill-info-fill { fill: #eff6ff; }
    .pill-info-text { font-size: 11px; fill: #1d4ed8; }
    .btn { fill: #fff; stroke: #e4e4e7; stroke-width: 0.5; }
    .btn-text { font-size: 12px; fill: #52525b; }
    .btn-primary { fill: #2563eb; }
    .btn-primary-text { font-size: 12px; fill: #fff; font-weight: 500; }
    .action-btn { fill: #fff; stroke: #e4e4e7; stroke-width: 0.5; }
    .action-btn-text { font-size: 11px; fill: #52525b; text-anchor: middle; }
    .slot-row { fill: transparent; }
    .slot-row-active { fill: #eff6ff; }
    .slot-text { font-size: 12px; fill: #52525b; }
    .slot-text-active { font-size: 12px; fill: #1d4ed8; font-weight: 500; }
    .slot-meta { font-size: 10px; fill: #a1a1aa; }
    .field { fill: #fafafa; stroke: #e4e4e7; stroke-width: 0.5; }
    .field-text { font-size: 11px; fill: #18181b; }
    .field-text-2 { font-size: 11px; fill: #52525b; }
    .field-label { font-size: 10px; fill: #71717a; text-transform: uppercase; letter-spacing: 0.04em; }
    .court-bg { fill: #fafafa; }
    .court-line { fill: none; stroke: #a1a1aa; stroke-width: 0.5; opacity: 0.5; }
    .court-line-strong { fill: none; stroke: #71717a; stroke-width: 0.6; opacity: 0.7; }
    .player-node { fill: #fff; stroke: #52525b; stroke-width: 0.5; }
    .player-active { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 0.8; }
    .player-text { font-size: 3.4px; fill: #18181b; text-anchor: middle; }
    .player-text-active { font-size: 3.4px; fill: #1d4ed8; text-anchor: middle; font-weight: 500; }
    .path-active { fill: none; stroke: #2563eb; stroke-width: 0.6; stroke-dasharray: 1.2 1.2; }
    .path-faint { fill: none; stroke: #a1a1aa; stroke-width: 0.4; stroke-dasharray: 1 1.4; opacity: 0.6; }
    .keyframe-dot { fill: #2563eb; }
    .ball { fill: #d97706; }
    .tag { fill: #f4f4f5; }
    .tag-text { font-size: 10px; fill: #52525b; }
    .canvas-overlay { fill: #fff; stroke: #e4e4e7; stroke-width: 0.5; }
    .canvas-overlay-text { font-size: 10px; fill: #52525b; }
    .timeline-track { fill: #e4e4e7; }
    .timeline-fill { fill: #2563eb; }
    .timeline-tick { stroke: #a1a1aa; stroke-width: 1; }
    .timeline-thumb { fill: #2563eb; }
    .lane-bg { fill: #f4f4f5; }
    .lane-keyframe { fill: #2563eb; }
    .lane-keyframe-muted { fill: #a1a1aa; opacity: 0.6; }
    .lane-action { fill: #2563eb; opacity: 0.22; }
    .lane-action-muted { fill: #71717a; opacity: 0.18; }
    .lane-action-text { font-size: 9px; fill: #1d4ed8; }
    .lane-action-text-muted { font-size: 9px; fill: #52525b; }
    .lane-label { font-size: 10px; fill: #71717a; }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="720"/>
  <rect class="panel" x="20" y="20" width="1160" height="680" rx="8"/>

  <!-- Top bar -->
  <g>
    <line class="divider" x1="20" y1="60" x2="1180" y2="60"/>
    <rect class="surface-3" x="20" y="20" width="1160" height="40" rx="8 8 0 0"/>

    <text x="36" y="44" font-size="14" fill="#52525b">←</text>
    <text x="58" y="44" font-size="14" fill="#18181b" font-weight="500">Horns Flare</text>
    <rect class="pill-neutral" x="172" y="32" width="44" height="18" rx="9"/>
    <text x="194" y="44" text-anchor="middle" class="pill-neutral-text">Draft</text>
    <text x="226" y="44" class="hint">· last saved 2 min ago</text>

    <rect class="btn" x="906" y="30" width="48" height="22" rx="4"/>
    <text x="930" y="44" text-anchor="middle" class="btn-text">Undo</text>
    <rect class="btn" x="958" y="30" width="48" height="22" rx="4"/>
    <text x="982" y="44" text-anchor="middle" class="btn-text">Redo</text>
    <rect class="btn" x="1010" y="30" width="68" height="22" rx="4"/>
    <text x="1044" y="44" text-anchor="middle" class="btn-text">Show paths ✓</text>
    <rect class="btn" x="1082" y="30" width="50" height="22" rx="4"/>
    <text x="1107" y="44" text-anchor="middle" class="btn-text">Preview</text>
    <rect class="btn-primary" x="1136" y="30" width="34" height="22" rx="4"/>
    <text x="1153" y="44" text-anchor="middle" class="btn-primary-text">Save</text>
  </g>

  <!-- Left rail -->
  <g>
    <line class="divider" x1="180" y1="60" x2="180" y2="540"/>

    <text class="label" x="32" y="80">Players</text>

    <rect class="slot-row-active" x="20" y="90" width="160" height="28" rx="4"/>
    <text class="slot-text-active" x="32" y="108">PG</text>
    <text class="slot-meta" x="168" y="108" text-anchor="end">3 kf</text>

    <rect class="slot-row" x="20" y="120" width="160" height="28"/>
    <text class="slot-text" x="32" y="138">SG</text>
    <text class="slot-meta" x="168" y="138" text-anchor="end">2 kf</text>

    <rect class="slot-row" x="20" y="150" width="160" height="28"/>
    <text class="slot-text" x="32" y="168">SF</text>
    <text class="slot-meta" x="168" y="168" text-anchor="end">2 kf</text>

    <rect class="slot-row" x="20" y="180" width="160" height="28"/>
    <text class="slot-text" x="32" y="198">PF</text>
    <text class="slot-meta" x="168" y="198" text-anchor="end">1 kf</text>

    <rect class="slot-row" x="20" y="210" width="160" height="28"/>
    <text class="slot-text" x="32" y="228">C</text>
    <text class="slot-meta" x="168" y="228" text-anchor="end">2 kf</text>

    <line class="divider" x1="20" y1="252" x2="180" y2="252"/>

    <text class="label" x="32" y="280">Add action</text>

    <rect class="action-btn" x="32" y="294" width="64" height="34" rx="4"/>
    <text x="64" y="316" class="action-btn-text">Pass</text>
    <rect class="action-btn" x="104" y="294" width="64" height="34" rx="4"/>
    <text x="136" y="316" class="action-btn-text">Screen</text>

    <rect class="action-btn" x="32" y="334" width="64" height="34" rx="4"/>
    <text x="64" y="356" class="action-btn-text">Cut</text>
    <rect class="action-btn" x="104" y="334" width="64" height="34" rx="4"/>
    <text x="136" y="356" class="action-btn-text">Dribble</text>

    <rect class="action-btn" x="32" y="374" width="64" height="34" rx="4"/>
    <text x="64" y="396" class="action-btn-text">Handoff</text>
    <rect class="action-btn" x="104" y="374" width="64" height="34" rx="4"/>
    <text x="136" y="396" class="action-btn-text">Shot</text>

    <text class="hint" x="32" y="424">Select players first, then click.</text>
  </g>

  <!-- Court canvas (middle) -->
  <g>
    <line class="divider" x1="900" y1="60" x2="900" y2="540"/>
    <rect class="surface-2" x="180" y="60" width="720" height="480"/>

    <!-- Court overlay top-left -->
    <rect class="canvas-overlay" x="200" y="80" width="146" height="22" rx="4"/>
    <text class="canvas-overlay-text" x="210" y="95">t = 0.0s · PG selected</text>

    <!-- Half court (centered) -->
    <g transform="translate(280, 90) scale(5.2)">
      <rect class="court-bg" x="0" y="0" width="100" height="84" rx="1"/>
      <rect class="court-line" x="2" y="2" width="96" height="80"/>
      <rect class="court-line" x="32" y="54" width="36" height="28"/>
      <circle class="court-line" cx="50" cy="54" r="7"/>
      <path class="court-line" d="M 26 82 A 24 24 0 0 1 74 82"/>
      <line class="court-line-strong" x1="44" y1="78" x2="56" y2="78"/>
      <circle class="court-line-strong" cx="50" cy="79" r="1.2" fill="none"/>

      <!-- PG path -->
      <path class="path-active" d="M 50 54 Q 47 46 45 38 T 40 33"/>
      <circle class="keyframe-dot" cx="50" cy="54" r="0.9"/>
      <circle class="keyframe-dot" cx="45" cy="38" r="0.9"/>
      <circle class="keyframe-dot" cx="40" cy="33" r="1.4"/>

      <!-- SG path (faint) -->
      <path class="path-faint" d="M 70 44 Q 75 58 82 70"/>

      <!-- Players -->
      <circle class="player-active" cx="50" cy="54" r="3.6"/>
      <text class="player-text-active" x="50" y="55.2">PG</text>

      <circle class="player-node" cx="70" cy="44" r="3.6"/>
      <text class="player-text" x="70" y="45.2">SG</text>

      <circle class="player-node" cx="30" cy="44" r="3.6"/>
      <text class="player-text" x="30" y="45.2">SF</text>

      <circle class="player-node" cx="40" cy="64" r="3.6"/>
      <text class="player-text" x="40" y="65.2">PF</text>

      <circle class="player-node" cx="60" cy="64" r="3.6"/>
      <text class="player-text" x="60" y="65.2">C</text>

      <circle class="ball" cx="50" cy="54" r="0.9"/>
    </g>
  </g>

  <!-- Right rail -->
  <g transform="translate(900, 60)">
    <rect class="surface-3" x="0" y="0" width="280" height="480"/>

    <text class="field-label" x="20" y="28">Play name</text>
    <rect class="field" x="20" y="36" width="240" height="30" rx="4"/>
    <text class="field-text" x="30" y="56">Horns Flare</text>

    <text class="field-label" x="20" y="92">Category</text>
    <rect class="field" x="20" y="100" width="240" height="30" rx="4"/>
    <text class="field-text-2" x="30" y="120">Offense</text>
    <text x="252" y="120" text-anchor="end" font-size="11" fill="#a1a1aa">›</text>

    <text class="field-label" x="20" y="156">Formation</text>
    <rect class="field" x="20" y="164" width="240" height="30" rx="4"/>
    <text class="field-text" x="30" y="184">Horns</text>

    <text class="field-label" x="20" y="220">Duration</text>
    <rect class="field" x="20" y="228" width="240" height="30" rx="4"/>
    <text class="field-text" x="30" y="248">6.0s</text>
    <text x="252" y="248" text-anchor="end" font-size="10" fill="#a1a1aa">auto-extends</text>

    <text class="field-label" x="20" y="284">Tags</text>
    <rect class="tag" x="20" y="292" width="60" height="20" rx="10"/>
    <text class="tag-text" x="50" y="305" text-anchor="middle">set play</text>
    <rect class="tag" x="86" y="292" width="56" height="20" rx="10"/>
    <text class="tag-text" x="114" y="305" text-anchor="middle">vs man</text>
    <text x="150" y="306" font-size="11" fill="#2563eb">+ Add tag</text>

    <text class="field-label" x="20" y="348">Description</text>
    <rect class="field" x="20" y="356" width="240" height="64" rx="4"/>
    <text class="field-text" x="30" y="376">PG enters to PF at elbow, SG flares</text>
    <text class="field-text" x="30" y="392">off C screen to the wing for an open</text>
    <text class="field-text" x="30" y="408">three.</text>
  </g>

  <!-- Timeline area -->
  <g transform="translate(20, 540)">
    <line class="divider" x1="0" y1="0" x2="1160" y2="0"/>
    <rect class="surface-3" x="0" y="0" width="1160" height="160" rx="0 0 8 8"/>

    <!-- Master timeline -->
    <g transform="translate(16, 14)">
      <text font-size="18" fill="#18181b">▶</text>
      <text class="body-3" x="30" y="14">0.0s</text>
      <rect class="timeline-track" x="64" y="6" width="1000" height="6" rx="3"/>
      <rect class="timeline-fill" x="64" y="6" width="200" height="6" rx="3"/>
      <line class="timeline-tick" x1="284" y1="3" x2="284" y2="15"/>
      <line class="timeline-tick" x1="480" y1="3" x2="480" y2="15"/>
      <line class="timeline-tick" x1="580" y1="3" x2="580" y2="15"/>
      <circle class="timeline-thumb" cx="264" cy="9" r="7"/>
      <text class="body-3" x="1076" y="14" text-anchor="end">6.0s</text>
      <rect class="btn" x="1086" y="0" width="40" height="20" rx="4"/>
      <text x="1106" y="14" text-anchor="middle" class="btn-text">1.0×</text>
    </g>

    <line class="divider" x1="0" y1="42" x2="1160" y2="42"/>

    <!-- Per-slot lanes -->
    <g transform="translate(16, 52)">
      <text class="lane-label" x="0" y="14">▾ Lanes</text>

      <text class="lane-label" x="40" y="34">PG</text>
      <rect class="lane-bg" x="80" y="22" width="1064" height="16" rx="2"/>
      <circle class="lane-keyframe" cx="84" cy="30" r="3"/>
      <circle class="lane-keyframe" cx="296" cy="30" r="3"/>
      <circle class="lane-keyframe" cx="612" cy="30" r="3"/>
      <rect class="lane-action" x="296" y="22" width="180" height="16" rx="3"/>
      <text class="lane-action-text" x="304" y="34">pass · PG → PF</text>

      <text class="lane-label" x="40" y="58">SG</text>
      <rect class="lane-bg" x="80" y="46" width="1064" height="16" rx="2"/>
      <circle class="lane-keyframe-muted" cx="84" cy="54" r="3"/>
      <circle class="lane-keyframe-muted" cx="528" cy="54" r="3"/>
      <rect class="lane-action-muted" x="350" y="46" width="160" height="16" rx="3"/>
      <text class="lane-action-text-muted" x="358" y="58">screen used</text>

      <text class="lane-label" x="40" y="82">SF</text>
      <rect class="lane-bg" x="80" y="70" width="1064" height="16" rx="2"/>
      <circle class="lane-keyframe-muted" cx="84" cy="78" r="3"/>
      <circle class="lane-keyframe-muted" cx="460" cy="78" r="3"/>

      <text class="lane-label" x="40" y="106">PF</text>
      <rect class="lane-bg" x="80" y="94" width="1064" height="16" rx="2"/>
      <circle class="lane-keyframe-muted" cx="84" cy="102" r="3"/>

      <text class="lane-label" x="40" y="130">C</text>
      <rect class="lane-bg" x="80" y="118" width="1064" height="16" rx="2"/>
      <circle class="lane-keyframe-muted" cx="84" cy="126" r="3"/>
      <circle class="lane-keyframe-muted" cx="280" cy="126" r="3"/>
    </g>
  </g>
</svg>
